{{extend defaultLayout}}
{{block 'css'}}
<link rel="stylesheet" href="{{_res_path}}enduid/css/info.css" />
{{/block}}
{{block 'main'}}
<header class="report-header">
  <div><h1>{{title}}</h1>{{if subtitle}}<p>{{subtitle}}</p>{{/if}}</div>
  <time class="report-time">{{time}}</time>
</header>
<section>
  {{each kv it}}
  <div class="info-row"><div class="info-key">{{it.k}}</div><div class="info-value">{{it.v}}</div></div>
  {{/each}}
</section>
{{if notes && notes.length}}
<aside class="info-notes">{{each notes n}}<p>{{n}}</p>{{/each}}</aside>
{{/if}}
{{/block}}
